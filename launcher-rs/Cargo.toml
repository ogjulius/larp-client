[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false

[workspace.dependencies]
larp-core = { path = "crates/larp-core" }
larp-net = { path = "crates/larp-net" }
larp-install = { path = "crates/larp-install" }
larp-launch = { path = "crates/larp-launch" }
larp-app = { path = "crates/larp-app" }

eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "clipboard", "default_fonts"] }
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
png = "0.18.1"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3.34"
fastrand = "2.5.0"
hex = "0.4.3"
md-5 = "0.11.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library code returns errors instead of crashing; tests may unwrap (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"   # only larp-cli prints, and it opts in explicitly
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
