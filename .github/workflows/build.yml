name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: larpclient
          path: |
            launcher/build/libs/larp-launcher-*.jar
            mod/build/libs/larpclient-*.jar

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher-rs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Phase 2 exit criterion: the Rust launcher installs the game and boots it with the mod loaded.
  rust-e2e:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher-rs
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build the bundle
        run: ./gradlew :launcher:rustBundle --console=plain
      - name: Build the launcher
        run: cargo build --release --locked -p larp-cli
        working-directory: launcher-rs
      - name: End-to-end
        # The game must run on Java 8; setup-java leaves JAVA_HOME at the last version (17).
        run: JAVA_HOME="$JAVA_HOME_8_X64" launcher-rs/scripts/e2e.sh
